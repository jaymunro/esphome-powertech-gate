                id(profile_full_open_min), id(profile_closed_position), id(profile_supports_pedestrian),
                id(profile_closed_tolerance), id(profile_opening_event_mode_hint), id(profile_single_closed_after_tracked_closing)});
            }
          
            void maintenance() {
